[project]
name = "finguard"
version = "0.1.0"
description = "Every number gets a receipt: Muse finds it on the filing page, code decides whether it matches."
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]
render = ["playwright>=1.40"]

[project.scripts]
finguard = "finguard.cli:main"

[tool.setuptools]
packages = ["finguard", "finguard.core", "finguard.plugins"]

[tool.setuptools.package-data]
finguard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
